services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graphlec}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-graphlec}"]
      interval: 5s
      retries: 5

  neo4j:
    image: neo4j:5.12
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  query_service:
    build:
      context: .
      dockerfile: ./query_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_API_KEY_2=${GOOGLE_API_KEY_2}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - GRAPHLEC_LANCE_ROOT=/lance/lancedb
    volumes:
      - lance_data:/lance
    depends_on:
      - neo4j

  backend:
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://user:pass@db/graphlec}
      - GOOGLE_API_KEY_1=${GOOGLE_API_KEY_1}
      - GOOGLE_API_KEY_2=${GOOGLE_API_KEY_2}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QUERY_SERVICE_URL=http://query_service:8001
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - GRAPHLEC_LANCE_ROOT=/lance/lancedb
      - LOCAL_STORAGE_DIR=/pipeline/local_storage
    volumes:
      - ./input:/pipeline/input
      - local_storage:/pipeline/local_storage
      - lance_data:/lance
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_started
      query_service:
        condition: service_started

  frontend:
    build: ./app/frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend


volumes:
  pgdata:
  neo4j_data:
  neo4j_logs:
  lance_data:
  local_storage: